<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#17161f" />

    <!-- Search: one page, one identity. Everything below is what Google reads
         to decide the site name and the title link, so the words have to match
         the ones on the page: brand first, then what the product is. -->
    <title>SLTP - Market Research, Backtests and Investing Insights</title>
    <meta
      name="description"
      content="SLTP is a beginner-friendly market research platform built for fast backtests and clearer investing decisions, running on nearly 30 years of daily market history."
    />
    <link rel="canonical" href="https://sltp-app.com/" />
    <meta name="robots" content="index,follow" />

    <!-- Link previews. og:site_name is one of the signals behind the site name
         Google shows above a result, so it says exactly what the schema says. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SLTP" />
    <meta property="og:title" content="SLTP - Market Research, Backtests and Investing Insights" />
    <meta
      property="og:description"
      content="Beginner-friendly market research: backtest a strategy in seconds, see the charts and metrics behind it, and follow the tickers you care about."
    />
    <meta property="og:url" content="https://sltp-app.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SLTP - Market Research, Backtests and Investing Insights" />
    <meta
      name="twitter:description"
      content="Beginner-friendly market research: backtest a strategy in seconds, see the charts and metrics behind it, and follow the tickers you care about."
    />

    <!-- Site name for Google. WebSite needs name and url and belongs on the
         home page only; alternateName is the ordered fallback list Google uses
         when it will not take the primary name, and the bare domain sits last
         as the safety net. Organization is referenced by @id rather than
         repeated, because two WebSite blocks on one page fight each other. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://sltp-app.com/#website",
            "url": "https://sltp-app.com/",
            "name": "SLTP",
            "alternateName": ["SLTP Research", "SLTP app", "sltp-app.com"],
            "description": "Beginner-friendly market research platform for fast backtests and clearer investing decisions, on nearly 30 years of daily market history.",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://sltp-app.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://sltp-app.com/#organization",
            "name": "SLTP",
            "url": "https://sltp-app.com/",
            "logo": "https://sltp-app.com/favicon-512.png"
          }
        ]
      }
    </script>

    <script>
      // Paints the right theme before the bundle runs. Without this the page
      // boots in the light palette and only turns dark once the account row
      // answers, which on a phone is long enough to look like a white page.
      (function () {
        try {
          var stored = sessionStorage.getItem('st_user_theme');
          if (!stored) {
            var raw = localStorage.getItem('st_user_settings');
            if (raw) stored = JSON.parse(raw).settings.theme;
          }
          var dark = stored
            ? /dark/i.test(stored)
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* Private browsing with storage blocked: the CSS default applies. */
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-BjMIPHRh.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/jsx-runtime-B-hcVAMW.js">
    <link rel="modulepreload" crossorigin href="/assets/createLucideIcon-4j-mWK0h.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CvI84W90.css">
  </head>

    <!-- Crawlable first paint, removed in main.tsx. Mirrors the hero in HomePage.tsx. -->
    <div id="root">
      <div id="boot-content">
        <p>Market research, backtests and investing insights</p>
        <h1>A Quantitative research platform built for better investing and trading decisions.</h1>
        <p>
          SLTP is an open-source platform that provides a comprehensive set of tools for
          quantitative research, backtesting, and investment insights.
        </p>
      </div>
    </div>

      #boot-content h1 { max-width: 20ch; margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; }
      #boot-content p { max-width: 60ch; margin: 1rem 0 0; line-height: 1.7; }
      #boot-content p:first-child { margin: 0 0 1rem; font-size: 0.875rem; letter-spacing: 0.06em; text-transform: uppercase; }
    </style>
  </body>
</html>
