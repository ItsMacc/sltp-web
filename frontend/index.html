<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#17161f" />
    <title>SLTP</title>
    <!-- Fonts are fetched in parallel with the bundle. As an @import inside the
         stylesheet they could only start once that file had parsed, which put a
         second round trip in front of the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Paints the right theme before the bundle runs. Without this the page
      // boots in the light palette and only turns dark once the account row
      // answers, which on a phone is long enough to look like a white page.
      (function () {
        try {
          var stored = sessionStorage.getItem('st_user_theme');
          if (!stored) {
            var raw = localStorage.getItem('st_user_settings');
            if (raw) stored = JSON.parse(raw).settings.theme;
          }
          var dark = stored
            ? /dark/i.test(stored)
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* Private browsing with storage blocked: the CSS default applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
