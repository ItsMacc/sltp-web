# daily.yml — the two nightly jobs: market data into R2, then the operator brief.
#
# Why Actions and not a cron on a server: both jobs are Python with real
# dependencies (numpy, pandas, pyarrow, yfinance, sltp), and GitHub's runners
# already have the repo, the lockstep, and a log per night. Cloudflare's free
# cron gives 10ms of CPU per invocation, which will not run this.
#
# Timing: both crons below are 17:30 in New York, which is after the 16:00 close
# either way, so the update never reads a half-finished session. GitHub cron is
# UTC and has no timezone field, so one entry cannot hold a local time across
# the daylight-saving switch: 21:30 UTC is 17:30 EDT but 16:30 EST, and 22:30
# UTC is 17:30 EST but 18:30 EDT. Both are scheduled and the off-season one is
# a duplicate — the freshness check below stops it before it downloads anything.
#
# Secrets live in Settings -> Secrets and variables -> Actions. None of them
# belong in this file.

name: Daily data and operator brief

on:
  schedule:
    # 17:30 New York: 21:30 UTC while the US is on daylight time (Mar -> Nov)...
    - cron: '30 21 * * *'
    # ...and 22:30 UTC once it is back on standard time (Nov -> Mar).
    - cron: '30 22 * * *'
  # Lets you fire it by hand from the Actions tab (and from a phone).
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A slow R2 merge must never overlap the next night's, and a
# half-written manifest is worse than a late one.
concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  market-data:
    name: R2 daily update
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # A secret that has not been created expands to an empty string, not to
    # nothing, so every consumer of these has to read empty as unset. R2_BUCKET
    # is the one that bites: an empty bucket name signs a request to the wrong
    # path. r2.py now falls back with `or`, and the values with code defaults
    # (SMTP_PORT, FROM_EMAIL) are simply not passed from here.
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The updater mails on failure, so it needs the sending account too.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # A missing secret should say which one, not fail inside the S3 client.
      - name: Check secrets
        run: |
          missing=0
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it under Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          exit $missing

      # Whichever cron belongs to the other half of the year arrives to find the
      # night already done. Ask the same calendar question the last step asks,
      # and stop here rather than downloading four days of bars for eleven
      # thousand symbols to discover the tail already carries them. A failing
      # check (no credentials, a stale bucket) reads as "not fresh" and falls
      # through to the update, which is where a real problem should surface.
      - name: Skip a duplicate cron when R2 is already current
        id: gate
        working-directory: backend
        shell: bash
        run: |
          if python scripts/daily_r2_update.py --check-fresh; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "R2 already carries the session the calendar expects; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update market data
        if: steps.gate.outputs.skip != 'true'
        working-directory: backend
        run: python scripts/daily_r2_update.py

      # An update that pulls nothing still exits 0, so the night would go green
      # with week-old bars. This asks the NYSE calendar what session should exist
      # and fails the run when R2's newest session is behind it.
      - name: Check the data is fresh
        working-directory: backend
        run: python scripts/daily_r2_update.py --check-fresh

  operator-brief:
    name: Operator brief
    # Runs even when the update failed: the brief is how you find out that it did.
    needs: market-data
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # The brief's health line asks R2 for its usage numbers, which is a
      # different credential from the S3 keys the upload uses.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # SLTP_DATA_URL is deliberately absent: app.config defaults it to the
      # public bucket, and an empty value would only shadow that default.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check secrets
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE TURSO_DATABASE_URL TURSO_AUTH_TOKEN ADMIN_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it under Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          exit $missing

      # --send keeps the "already sent today" marker, which now lives in Turso, so
      # a manual dispatch on a day that already went out stays quiet.
      - name: Mail the brief
        working-directory: backend
        shell: bash
        run: |
          # pipefail, or `tee` would report success and hide a failed send.
          set -o pipefail
          python scripts/operator_report.py --send | tee brief.txt

      # The run page should tell you the numbers without opening the mail.
      - name: Put the brief on the run page
        if: always()
        run: |
          if [ -f backend/brief.txt ]; then
            { echo '## Operator brief'; echo '```'; cat backend/brief.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The data job's exit code is the real answer for the night, so it wins.
      - name: Report the data job's result
        if: needs.market-data.result != 'success'
        run: |
          echo "::error::The market data update finished as '${{ needs.market-data.result }}'. The brief above still went out."
          exit 1
