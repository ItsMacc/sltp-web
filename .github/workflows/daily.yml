# daily.yml — the two nightly jobs: market data into R2, then the operator brief.
#
# Why Actions and not a cron on a server: both jobs are Python with real
# dependencies (numpy, pandas, pyarrow, yfinance, sltp), and GitHub's runners
# already have the repo, the lockstep, and a log per night. Cloudflare's free
# cron gives 10ms of CPU per invocation, which will not run this.
#
# Timing: 21:30 UTC is 17:30 US Eastern in daylight saving and 16:30 in winter.
# GitHub cron has no timezone field, and this pair lands after the 16:00 close
# either way, so the update never reads a half-finished session.
#
# Secrets live in Settings -> Secrets and variables -> Actions. None of them
# belong in this file.

name: Daily data and operator brief

on:
  schedule:
    - cron: '30 21 * * *'
  # Lets you fire it by hand from the Actions tab (and from a phone).
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A slow R2 merge must never overlap the next night's, and a
# half-written manifest is worse than a late one.
concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  market-data:
    name: R2 daily update
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The updater mails on failure, so it needs the sending account too.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # A missing secret should say which one, not fail inside the S3 client.
      - name: Check secrets
        run: |
          missing=0
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it under Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Update market data
        working-directory: backend
        run: python scripts/daily_r2_update.py

  operator-brief:
    name: Operator brief
    # Runs even when the update failed: the brief is how you find out that it did.
    needs: market-data
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check secrets
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE TURSO_DATABASE_URL TURSO_AUTH_TOKEN ADMIN_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it under Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          exit $missing

      # --send keeps the "already sent today" marker, which now lives in Turso, so
      # a manual dispatch on a day that already went out stays quiet.
      - name: Mail the brief
        working-directory: backend
        shell: bash
        run: |
          # pipefail, or `tee` would report success and hide a failed send.
          set -o pipefail
          python scripts/operator_report.py --send | tee brief.txt

      # The run page should tell you the numbers without opening the mail.
      - name: Put the brief on the run page
        if: always()
        run: |
          if [ -f backend/brief.txt ]; then
            { echo '## Operator brief'; echo '```'; cat backend/brief.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The data job's exit code is the real answer for the night, so it wins.
      - name: Report the data job's result
        if: needs.market-data.result != 'success'
        run: |
          echo "::error::The market data update finished as '${{ needs.market-data.result }}'. The brief above still went out."
          exit 1
